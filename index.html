<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>This is for you 💖</title>

<!-- Serif Font -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  height:100vh;
  font-family:'Playfair Display', serif;
  background:radial-gradient(circle at top,#3a0b1d,#000 70%);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  overflow:hidden;
  position:relative;
}

/* PAGE STYLE */
.page{
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  transition:opacity 1s;
}

.hidden{display:none;}

.container{padding:20px;}

h1{
  font-size:30px;
  line-height:1.3;
}

p{opacity:0.85;}

button{
  margin-top:25px;
  padding:14px 36px;
  border:none;
  border-radius:30px;
  background:#e94b8b;
  color:white;
  font-size:18px;
}

/* PAGE GIFS */
.page-gif{
  width:160px;
  margin-bottom:20px;
  border-radius:15px;
}

/* FLOATING ANIMATION */
@keyframes float {
  0% { transform: translateY(0px); }
  50% { transform: translateY(-10px); }
  100% { transform: translateY(0px); }
}

/* PAGE 3 */
#lyrics-container{
  font-size:26px;
  min-height:60px;
  white-space: pre-line; /* keeps \n as line break */
  display: inline-block;
  animation: float 3s ease-in-out infinite;
}

#line-gif{
  width:180px;
  margin:15px auto 0;
  display:none;
  animation: float 3s ease-in-out infinite;
}

/* FLOATING HEARTS/STARS/FLOWERS */
.floating {
  position: absolute;
  font-size: 20px;
  pointer-events: none;
  user-select: none;
  animation-name: floatUp;
  animation-timing-function: linear;
  animation-iteration-count: infinite;
}

@keyframes floatUp {
  0% { transform: translateY(100vh) scale(1); opacity:1; }
  100% { transform: translateY(-10vh) scale(0.5); opacity:0; }
}
</style>
</head>

<body>

<!-- PAGE 1 -->
<div class="page" id="page1">
  <div class="container">
    <img src="hii.gif" class="page-gif">
    <h1>Will you do me a favor,<br>please?</h1>
    <button onclick="showPage2()">Show me ♥</button>
  </div>
</div>

<!-- PAGE 2 -->
<div class="page hidden" id="page2">
  <div class="container">
    <img src="nervous.gif" class="page-gif">
    <h1>I want to say something to you</h1>
    <p>Just listen for a moment 🤍</p>
    <button onclick="showPage3()">Open it ♥</button>
  </div>
</div>

<!-- PAGE 3 -->
<div class="page hidden" id="page3">
  <div class="container">
    <div id="lyrics-container"></div>
    <img id="line-gif">
  </div>
</div>

<!-- AUDIO -->
<audio id="song" src="tereliye_clip.mp3"></audio>

<script>
function fade(from,to){
  to.classList.remove("hidden");
  to.style.opacity=0;
  setTimeout(()=>{
    from.style.opacity=0;
    to.style.opacity=1;
    setTimeout(()=>from.classList.add("hidden"),1000);
  },50);
}

function showPage2(){ fade(page1,page2); }
function showPage3(){ 
  fade(page2,page3);
  song.play();
  let i=0;

  function typeWriter(text, callback){
    let j=0;
    lyricsBox.textContent="";
    function typing(){
      if(j<text.length){
        lyricsBox.textContent += text.charAt(j);
        j++;
        setTimeout(typing,50);
      } else { if(callback) callback(); }
    }
    typing();
  }

  function sync(){
    let t=song.currentTime;
    if(i<lyrics.length && t>=lyrics[i].time){
      typeWriter(lyrics[i].text);
      if(lyrics[i].gif){ gif.src=lyrics[i].gif; gif.style.display="block"; } 
      else{ gif.style.display="none"; }
      i++;
    }
    requestAnimationFrame(sync);
  }
  sync();
}

/* LYRICS + GIF SYNC */
const lyrics=[
 {time:0, text:"Zara pass Tu aa mere", gif:"paas-aa.gif"},
 {time:4, text:"Dheere se chuu jaa mujhe", gif:"choo-ja.gif"},
 {time:8, text:"Khojaun tere pyar mein", gif:"kho-jau.gif"},
 {time:12, text:"Bahon me bhar le mujhe", gif:"bahon-me.gif"},
 {time:15.5, text:"Wohhh ohhhh", gif:"wohh.gif"},
 {time:19, text:"Tere liye jhoomu deewana banke tere liye", gif:"tereliye.gif"}, 
 {time:25, text:"will you accept?\ntake your time", gif:"accept.gif"}
];

const song=document.getElementById("song");
const lyricsBox=document.getElementById("lyrics-container");
const gif=document.getElementById("line-gif");

/* CREATE FLOATING HEARTS/STARS/FLOWERS */
const symbols=["❤️","💖","🌸","⭐","💫"];
function createFloating(){
  const span=document.createElement("span");
  span.className="floating";
  span.textContent=symbols[Math.floor(Math.random()*symbols.length)];
  span.style.left=Math.random()*100+"vw";
  span.style.fontSize=(15+Math.random()*25)+"px";
  span.style.animationDuration=(5+Math.random()*5)+"s";
  document.body.appendChild(span);
  // remove after animation ends
  setTimeout(()=>{ span.remove(); },10000);
}
setInterval(createFloating,300); // create new symbol every 0.3s
</script>

</body>
</html>
